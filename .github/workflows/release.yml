name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'      # Стабильный релиз (например, v1.0.4)
      - 'b*'      # Тестовая сборка (например, b3) — уходит в pre-release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # dict.db в git не хранится — она больше лимита GitHub в 100 МБ и
      # собирается из rawSources/work/*.jsonl. Сборка занимает около получаса,
      # поэтому результат кэшируется по содержимому входов: пока jsonl и
      # сборщик не менялись, база берётся из кэша и задача пропускается.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache dictionary database
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/dict.db
            .dictdb-stamp
          key: dictdb-${{ hashFiles('rawSources/work/*.jsonl', 'rawSources/work/reviewed.tsv', 'tools/db_builders/build_app_db.py') }}

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — релиз собирать нечем"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          if grep -qi "CN=Android Debug" signer.txt; then
            echo "::error::Артефакт подписан отладочным ключом — публиковать нельзя"
            exit 1
          fi

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload AAB for stores
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS="--generate-notes"
          # Тег вида b6 — тестовая сборка, помечаем как pre-release
          if [[ "${{ github.ref_name }}" == b* ]]; then
            FLAGS="$FLAGS --prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/release/SHA256SUMS.txt \
            $FLAGS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"
